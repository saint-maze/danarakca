<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin</title>
  <link rel="icon" type="image/png" href="img/thunderbolt.png">
  <link rel="apple-touch-icon" href="img/thunderbolt.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            obsidian: '#101010',
            carbon: '#080808',
            chalk: '#f3f3f3',
            smoke: '#9c9c9c',
            ash: '#c1c1c1',
            graphite: '#212121',
            iron: '#474747',
            pulse: '#98ff38',
            loss: '#ff7a6b'
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace']
          },
          borderRadius: {
            tag: '4px',
            card: '8px'
          }
        }
      }
    };
  </script>
</head>

<body class="bg-obsidian text-chalk min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="hairline-b bg-obsidian">
    <div class="w-full max-w-[1600px] mx-auto px-4 sm:px-10 py-3.5 sm:py-4 flex items-center justify-between">
      <div class="flex items-center gap-3.5">
        <img src="img/logo-danarakca.png" alt="Logo Danarakca"
          class="h-11 sm:h-12 w-auto object-contain shrink-0 drop-shadow-sm">
        <a href="index.html"
          class="text-heading-xs tracking-tight text-chalk hover:text-ash transition-colors font-medium">
          Danarakca
        </a>
        <span class="text-caption text-smoke hidden sm:inline font-mono text-xs">/ Portal Admin</span>
      </div>
      <a href="index.html" class="text-caption text-smoke hover:text-chalk font-mono text-xs">
        ← Kembali ke Beranda
      </a>
    </div>
  </header>

  <!-- Login Main -->
  <main class="flex-grow flex items-center justify-center p-6 relative">
    <div class="absolute inset-0 dot-field pointer-events-none opacity-40"></div>

    <div class="w-full max-w-md relative z-10">

      <div class="panel-deep p-8 sm:p-10">

        <div class="mb-8">
          <div class="meta mb-2">Autentikasi Admin</div>
          <h1 class="text-heading-sm text-chalk mb-2">Login Admin</h1>
          <p class="text-caption text-smoke leading-relaxed">
            Akses khusus Admin untuk mengundi kartu skenario, membuka sesi input alokasi peserta, dan mengelola tahap
            permainan.
          </p>
        </div>

        <!-- Error Message Banner -->
        <div id="errorAlert"
          class="hidden mb-6 p-4 rounded-card hairline bg-carbon text-loss text-caption leading-relaxed">
          <span id="errorAlertText">Kredensial tidak valid.</span>
        </div>

        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)" class="space-y-5">
          <div>
            <label for="username" class="block meta mb-2">ID</label>
            <input type="text" id="username" name="username" required autocomplete="username" value="admin"
              placeholder="admin" class="field font-mono">
          </div>

          <div>
            <div class="flex items-center justify-between mb-2">
              <label for="password" class="block meta">Password</label>
              <button type="button" onclick="togglePasswordVisibility()"
                class="text-caption text-smoke hover:text-chalk" id="togglePassBtn">
                Tampilkan
              </button>
            </div>
            <input type="password" id="password" name="password" required autocomplete="current-password"
              placeholder="Masukkan password..." class="field font-mono">
          </div>

          <div class="pt-2">
            <button type="submit" id="submitBtn" class="btn-pill w-full">
              Masuk ke Page Admin ↗
            </button>
          </div>
        </form>

        <div class="mt-8 pt-6 hairline-t flex items-center justify-between text-caption text-smoke">
          <span>Kredensial default: <code class="text-ash font-mono">admin</code></span>
          <a href="player.html" class="hover:text-chalk">Masuk Peserta →</a>
        </div>

      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="hairline-t bg-obsidian py-4 text-center text-caption text-smoke">
    Admin Danarakca \\\ Restricted
  </footer>

  <script>
    (async function checkExistingAuth() {
      const token = localStorage.getItem('danarakca_admin_token');
      if (!token) return;

      try {
        const res = await fetch('/api/admin/verify', {
          headers: { 'X-Admin-Token': token }
        });
        const data = await res.json();
        if (data.success && data.authenticated) {
          window.location.href = 'facilitator.html';
        }
      } catch (err) {
        console.error('Verification error:', err);
      }
    })();

    function togglePasswordVisibility() {
      const input = document.getElementById('password');
      const btn = document.getElementById('togglePassBtn');
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerText = 'Sembunyikan';
      } else {
        input.type = 'password';
        btn.innerText = 'Tampilkan';
      }
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const btn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('errorAlert');
      const alertText = document.getElementById('errorAlertText');

      alertBox.classList.add('hidden');
      btn.disabled = true;
      btn.innerText = 'Memverifikasi...';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });
        const json = await res.json();

        if (json.success && json.token) {
          localStorage.setItem('danarakca_admin_token', json.token);
          window.location.href = 'facilitator.html';
        } else {
          alertText.innerText = json.error || 'ID atau Password salah.';
          alertBox.classList.remove('hidden');
        }
      } catch (err) {
        alertText.innerText = 'Gagal menghubungi server: ' + err.message;
        alertBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Masuk ke Konsol Kendali ↗';
      }
    }
  </script>

</body>

</html>
